version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sahayata
      POSTGRES_USER: sahayata
      POSTGRES_PASSWORD: sahayata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayata"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: dev
      SECRET_KEY: dev-secret-change-me
      DATABASE_URL: postgresql+psycopg://sahayata:sahayata@db:5432/sahayata
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      STORAGE_DRIVER: local
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py --demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: /api
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads:
